// ─── UNLOCK STATE ──────────────────────────────────────────────
function getUnlocked() {
  try { return JSON.parse(sessionStorage.getItem('unlocked') || '[]'); } catch(e) { return []; }
}
function isUnlocked(chapId) {
  const u = getUnlocked();
  return chapId === 1 || u.includes('full') || u.includes(chapId);
}

// ─── PARSE URL ─────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const babId = parseInt(params.get('bab')) || 1;
const slug = params.get('slug') || '';

const chapter = chapters.find(c => c.id === babId);
const lessonIndex = chapter ? chapter.lessons.findIndex(l => l.slug === slug) : 0;
const lesson = chapter ? chapter.lessons[lessonIndex >= 0 ? lessonIndex : 0] : null;

// ─── RENDER PAGE ───────────────────────────────────────────────
function renderPage() {
  if (!chapter || !lesson) {
    document.getElementById('lessonTitle').textContent = 'Materi tidak ditemukan';
    return;
  }

  const unlocked = isUnlocked(babId);

  // Nav + breadcrumb
  document.title = `${lesson.name} — Arsitek Sarungan`;
  document.getElementById('navTitle').textContent = lesson.name;
  document.getElementById('bcBab').textContent = chapter.title;
  document.getElementById('bcLesson').textContent = lesson.name;

  // Header
  document.getElementById('babTag').textContent = `BAB ${babId}`;
  document.getElementById('lessonTitle').textContent = lesson.name;
  document.getElementById('lessonMeta').innerHTML = `
    <div class="lesson-meta-item">${lesson.type} ${lesson.typeLabel}</div>
    ${lesson.content ? `<div class="lesson-meta-item">· ${lesson.content.description || ''}</div>` : ''}
  `;

  // Body content
  renderLessonBody(lesson, unlocked);

  // Prev / Next
  renderNavigation(chapter, lessonIndex, unlocked);

  // Sidebar
  renderSidebar(chapter, lessonIndex, unlocked);
}

function renderLessonBody(lesson, unlocked) {
  const body = document.getElementById('lessonBody');
  const c = lesson.content;
  if (!c) { body.innerHTML = '<div class="content-card"><p>Konten sedang disiapkan.</p></div>'; return; }

  if (c.type === 'video') {
    body.innerHTML = `
      <div class="video-container">
        <div class="video-placeholder">
          <div class="play-circle">▶</div>
          <h3>${c.videoTitle}</h3>
          <p>${c.description}</p>
          <p style="font-size:0.75rem;color:var(--muted);margin-top:4px">Video akan tersedia setelah integrasi platform video</p>
        </div>
      </div>
      <div class="content-card">
        <h2>Tentang Materi Ini</h2>
        <p>Materi video ini adalah bagian dari <strong>${chapter.title}</strong>. Ikuti langkah-langkah yang ditunjukkan di video untuk hasil terbaik.</p>
        <p>Pastikan kamu sudah mendownload semua file eksklusif di BAB ini sebelum memulai praktik.</p>
      </div>
    `;
  } else if (c.type === 'file') {
    body.innerHTML = `
      <div class="content-card">
        <h2>📁 File Eksklusif</h2>
        <p>File ini adalah bagian dari materi <strong>${chapter.title}</strong>. Simpan dan gunakan sesuai instruksi di video.</p>
      </div>
      <div class="file-card" onclick="downloadFile()">
        <div class="file-card-icon">📦</div>
        <div class="file-card-info">
          <div class="file-card-name">${c.fileName}</div>
          <div class="file-card-desc">${c.fileDesc}</div>
          <div style="font-size:0.72rem;color:var(--muted);margin-top:4px">Ukuran: ${c.fileSize}</div>
        </div>
        <button class="file-card-btn" onclick="downloadFile()">⬇ Unduh</button>
      </div>
      <div class="content-card" style="margin-top:12px">
        <h2>Cara Menggunakan File</h2>
        <ul>
          <li>Extract file zip (jika format .zip) ke folder project kamu</li>
          <li>Untuk file .rbz: buka SketchUp → Extensions → Install Extension → pilih file .rbz</li>
          <li>Untuk file .skp: buka langsung di SketchUp sebagai template atau referensi</li>
          <li>Ikuti instruksi lebih detail di video materi yang berkaitan</li>
        </ul>
      </div>
    `;
  } else if (c.type === 'reading') {
    body.innerHTML = `<div class="content-card">${c.body}</div>`;
  }
}

function renderNavigation(chapter, currentIdx, unlocked) {
  const prevBtn = document.getElementById('btnPrev');
  const nextBtn = document.getElementById('btnNext');

  // Build flat list of all lessons across all chapters
  const allLessons = [];
  chapters.forEach(ch => {
    ch.lessons.forEach(l => allLessons.push({ ...l, chapId: ch.id }));
  });
  const flatIdx = allLessons.findIndex(l => l.slug === lesson.slug);

  const prevLesson = flatIdx > 0 ? allLessons[flatIdx - 1] : null;
  const nextLesson = flatIdx < allLessons.length - 1 ? allLessons[flatIdx + 1] : null;

  if (prevLesson) {
    const prevUnlocked = isUnlocked(prevLesson.chapId);
    const canOpen = prevUnlocked || prevLesson.preview || prevLesson.free;
    prevBtn.classList.toggle('disabled', !canOpen);
    if (canOpen) prevBtn.href = `lesson.html?bab=${prevLesson.chapId}&slug=${encodeURIComponent(prevLesson.slug)}&name=${encodeURIComponent(prevLesson.name)}`;
    document.getElementById('prevName').textContent = prevLesson.name;
  } else {
    prevBtn.classList.add('disabled');
    document.getElementById('prevName').textContent = 'Awal Kursus';
  }

  if (nextLesson) {
    const nextUnlocked = isUnlocked(nextLesson.chapId);
    const canOpen = nextUnlocked || nextLesson.preview || nextLesson.free;
    nextBtn.classList.toggle('disabled', !canOpen);
    if (canOpen) nextBtn.href = `lesson.html?bab=${nextLesson.chapId}&slug=${encodeURIComponent(nextLesson.slug)}&name=${encodeURIComponent(nextLesson.name)}`;
    document.getElementById('nextName').textContent = nextLesson.name;
  } else {
    nextBtn.classList.add('disabled');
    document.getElementById('nextName').textContent = 'Akhir Kursus';
  }
}

function renderSidebar(chapter, currentIdx, unlocked) {
  document.getElementById('sidebarHead').textContent = `BAB ${chapter.id} — Daftar Materi`;
  const total = chapter.lessons.length;
  const accessible = chapter.lessons.filter(l => unlocked || l.preview || l.free).length;
  document.getElementById('progressText').textContent = `${accessible}/${total} terbuka`;
  document.getElementById('progressFill').style.width = `${(accessible/total)*100}%`;

  document.getElementById('sidebarList').innerHTML = chapter.lessons.map((l, i) => {
    const canOpen = unlocked || l.preview || l.free;
    const isActive = i === currentIdx;
    const href = canOpen ? `lesson.html?bab=${babId}&slug=${encodeURIComponent(l.slug)}&name=${encodeURIComponent(l.name)}` : '#';
    return `<a class="sidebar-lesson${isActive?' active':''}${!canOpen?' locked':''}" href="${href}">
      <div class="sidebar-num">${i + 1}</div>
      <div class="sidebar-lesson-name">${l.name}</div>
      <span style="font-size:0.8rem;flex-shrink:0">${canOpen ? (isActive ? '▶' : l.type) : '🔒'}</span>
    </a>`;
  }).join('');
}

function downloadFile() {
  alert('Fitur download akan aktif setelah integrasi platform. File akan tersedia di akun kamu.');
}

renderPage();
</script>
