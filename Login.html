<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  

</head>
<style>
body{

  margin:0;

  background:#0f172a;

  font-family:sans-serif;
}

.login-wrap{

  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{

  width:320px;

  background:#1e293b;

  padding:30px;

  border-radius:20px;
}

.login-card h1{

  color:white;
}

.login-card input{

  width:90%;

  padding:14px;

  margin-top:14px;

  border:none;

  border-radius:12px;
}

.login-card button{

  width:100%;

  margin-top:20px;

  padding:14px;

  border:none;

  background:#facc15;

  border-radius:12px;

  font-weight:bold;

  cursor:pointer;
}
</style>
<body>

  <div class="login-wrap">

    <form
      class="login-card"
      onsubmit="login(event)">

      <h1>Login</h1>

      <input
        type="text"
        id="name"
        placeholder="Nama">

      <input
        type="email"
        id="email"
        placeholder="Email">

      <button type="submit">

        Masuk

      </button>

    </form>

  </div>

<script>

function login(e){

  e.preventDefault();

  const name =
  document.getElementById('name').value;

  const email =
  document.getElementById('email').value;

  if(!name || !email){

    alert('Isi semua data');

    return;
  }

  localStorage.setItem(
    'user',
    JSON.stringify({
      name,
      email
    })
  );

  window.location.href =
  'index.html';
}

</script>

</body>
</html>
